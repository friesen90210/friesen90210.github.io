<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>E.T. Bike Escape</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0f19; /* Deep night sky */
            font-family: 'Inter', sans-serif;
            touch-action: none; /* Prevent scroll on touch */
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .pixel-font {
            font-family: 'Press Start 2P', cursive;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to canvas */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .interactive-ui {
            pointer-events: auto;
        }
        /* Custom UI overlays */
        .overlay {
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI Layer -->
    <div id="ui-layer" class="p-6">
        <!-- HUD -->
        <div class="flex justify-between items-start w-full">
            <div id="scoreDisplay" class="pixel-font text-2xl text-white drop-shadow-md hidden">
                SCORE: 0
            </div>
            <div id="instructions" class="text-white/70 text-sm hidden md:block">
                Hold SPACE or TAP to fly!
            </div>
        </div>

        <!-- Start Screen -->
        <div id="startScreen" class="interactive-ui absolute inset-0 flex flex-col items-center justify-center overlay">
            <h1 class="pixel-font text-4xl md:text-6xl text-center text-white mb-4 leading-tight">
                BIKE<br><span class="text-orange-400">ESCAPE</span>
            </h1>
            <p class="text-gray-300 text-center mb-8 max-w-md px-4">
                Help Elliott and his friend escape the authorities! Collect candies and avoid the Hazmat agents.
            </p>
            <button id="startBtn" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 px-8 rounded-full shadow-[0_0_20px_rgba(249,115,22,0.5)] transition-all transform hover:scale-105 active:scale-95 text-xl">
                FLY AWAY
            </button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="interactive-ui absolute inset-0 flex flex-col items-center justify-center overlay hidden">
            <h2 class="pixel-font text-4xl text-red-500 mb-2">CAUGHT!</h2>
            <p class="text-white text-xl mb-6">Final Score: <span id="finalScore" class="font-bold text-orange-400">0</span></p>
            <button id="restartBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-all transform hover:scale-105 active:scale-95">
                TRY AGAIN
            </button>
        </div>
    </div>

    <script>
        /**
         * ENGINE ARCHITECTURE & GAME LOGIC
         * We use an object-oriented approach for game entities and a centralized game loop.
         */

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI Elements
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const finalScoreDisplay = document.getElementById('finalScore');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const instructions = document.getElementById('instructions');

        // Game State
        let GAME_WIDTH = window.innerWidth;
        let GAME_HEIGHT = window.innerHeight;
        let isPlaying = false;
        let score = 0;
        let frameCount = 0;
        let gameSpeed = 5;
        let isThrusting = false;

        // Resize handler
        function resize() {
            GAME_WIDTH = window.innerWidth;
            GAME_HEIGHT = window.innerHeight;
            canvas.width = GAME_WIDTH;
            canvas.height = GAME_HEIGHT;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- ENTITIES ---

        class Background {
            constructor() {
                this.stars = [];
                for(let i=0; i<100; i++) {
                    this.stars.push({
                        x: Math.random() * GAME_WIDTH,
                        y: Math.random() * GAME_HEIGHT * 0.7,
                        size: Math.random() * 2,
                        twinkle: Math.random()
                    });
                }
                this.moonY = GAME_HEIGHT * 0.3;
                this.trees = [];
                for(let i=0; i<GAME_WIDTH/50; i++) {
                    this.trees.push({
                        x: i * 80 + Math.random() * 40,
                        height: 50 + Math.random() * 100
                    });
                }
                this.treeOffset = 0;
            }

            update() {
                this.treeOffset -= gameSpeed * 0.2; // Parallax effect
                if (this.treeOffset <= -80) {
                    this.treeOffset += 80;
                    this.trees.shift();
                    this.trees.push({
                        x: this.trees[this.trees.length-1].x + 80,
                        height: 50 + Math.random() * 100
                    });
                }
            }

            draw(ctx) {
                // Sky gradient
                let grad = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
                grad.addColorStop(0, '#0b0f19');
                grad.addColorStop(1, '#1a2942');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

                // Stars
                ctx.fillStyle = 'white';
                this.stars.forEach(star => {
                    star.twinkle += 0.05;
                    ctx.globalAlpha = 0.5 + Math.sin(star.twinkle) * 0.5;
                    ctx.fillRect(star.x, star.y, star.size, star.size);
                });
                ctx.globalAlpha = 1.0;

                // Massive Moon
                ctx.fillStyle = '#fdfbd3';
                ctx.beginPath();
                ctx.arc(GAME_WIDTH * 0.7, this.moonY, 150, 0, Math.PI * 2);
                ctx.fill();
                // Moon craters
                ctx.fillStyle = 'rgba(0,0,0,0.05)';
                ctx.beginPath(); ctx.arc(GAME_WIDTH * 0.7 - 40, this.moonY - 30, 20, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(GAME_WIDTH * 0.7 + 50, this.moonY + 40, 35, 0, Math.PI*2); ctx.fill();

                // Parallax Trees (Silhouettes)
                ctx.fillStyle = '#05070a';
                ctx.beginPath();
                ctx.moveTo(0, GAME_HEIGHT);
                this.trees.forEach(tree => {
                    ctx.lineTo(tree.x + this.treeOffset, GAME_HEIGHT - tree.height);
                    ctx.lineTo(tree.x + this.treeOffset + 40, GAME_HEIGHT);
                });
                ctx.lineTo(GAME_WIDTH, GAME_HEIGHT);
                ctx.fill();

                // Ground
                ctx.fillStyle = '#0a0d14';
                ctx.fillRect(0, GAME_HEIGHT - 30, GAME_WIDTH, 30);
            }
        }

        class Bike {
            constructor() {
                this.width = 80;
                this.height = 60;
                this.x = GAME_WIDTH * 0.15;
                this.y = GAME_HEIGHT / 2;
                this.vy = 0;
                this.gravity = 0.3;
                this.lift = -0.6;
                this.rotation = 0;
                this.particles = [];
            }

            update() {
                // Physics
                if (isThrusting) {
                    this.vy += this.lift;
                    // Sparkles when flying
                    if (frameCount % 3 === 0) {
                        this.particles.push({
                            x: this.x + 10,
                            y: this.y + this.height,
                            vx: -Math.random() * 2 - 1,
                            vy: Math.random() * 2 - 1,
                            life: 1.0
                        });
                    }
                } else {
                    this.vy += this.gravity;
                }
                
                // Terminal velocity & dampening
                this.vy *= 0.95;
                this.y += this.vy;

                // Floor collision (Bike can roll on ground)
                if (this.y > GAME_HEIGHT - 30 - this.height) {
                    this.y = GAME_HEIGHT - 30 - this.height;
                    this.vy = 0;
                }
                // Ceiling collision
                if (this.y < 0) {
                    this.y = 0;
                    this.vy = 0;
                }

                // Tilt based on velocity
                this.rotation = Math.min(Math.max(this.vy * 0.05, -0.3), 0.3);

                // Update particles
                for(let i = this.particles.length - 1; i >= 0; i--) {
                    let p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.05;
                    if(p.life <= 0) this.particles.splice(i, 1);
                }
            }

            draw(ctx) {
                // Draw particles
                this.particles.forEach(p => {
                    ctx.fillStyle = `rgba(255, 200, 100, ${p.life})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
                    ctx.fill();
                });

                ctx.save();
                ctx.translate(this.x + this.width/2, this.y + this.height/2);
                ctx.rotate(this.rotation);
                ctx.translate(-this.width/2, -this.height/2);

                // Bike Frame (Simplified)
                ctx.strokeStyle = '#cccccc';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(20, 40); // Back wheel center
                ctx.lineTo(40, 20); // Seat
                ctx.lineTo(60, 40); // Front wheel center
                ctx.moveTo(40, 20);
                ctx.lineTo(55, 15); // Handlebars
                ctx.stroke();

                // Wheels
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 4;
                ctx.beginPath(); ctx.arc(20, 40, 12, 0, Math.PI*2); ctx.stroke();
                ctx.beginPath(); ctx.arc(60, 40, 12, 0, Math.PI*2); ctx.stroke();

                // Elliott (Red Hoodie)
                ctx.fillStyle = '#cc0000'; // Red jacket
                ctx.beginPath();
                ctx.moveTo(35, 20); // Butt
                ctx.lineTo(45, 5);  // Shoulders
                ctx.lineTo(50, 15); // Hands on handlebar
                ctx.lineTo(40, 20); // Back to seat
                ctx.fill();
                // Elliott Head
                ctx.fillStyle = '#ffccaa';
                ctx.beginPath(); ctx.arc(45, 0, 6, 0, Math.PI*2); ctx.fill();

                // Front Basket
                ctx.fillStyle = '#8b5a2b';
                ctx.fillRect(65, 10, 15, 12);
                
                // E.T. Head peaking out
                ctx.fillStyle = '#7a5230';
                ctx.beginPath();
                ctx.arc(72, 8, 7, 0, Math.PI*2); // Head
                ctx.fill();
                ctx.fillStyle = 'black'; // Eyes
                ctx.beginPath(); ctx.arc(70, 7, 1.5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(74, 7, 1.5, 0, Math.PI*2); ctx.fill();

                ctx.restore();
            }

            // AABB Collision bounds (slightly smaller than visual size for fairness)
            getBounds() {
                return {
                    x: this.x + 10,
                    y: this.y + 10,
                    w: this.width - 20,
                    h: this.height - 20
                };
            }
        }

        class Hazmat {
            constructor() {
                this.width = 40;
                this.height = 70;
                this.x = GAME_WIDTH;
                this.y = GAME_HEIGHT - 30 - this.height; // On the ground
                this.passed = false;
                
                // Sometimes they have a tall net/drone in the sky to force low flying
                this.hasDrone = Math.random() > 0.6;
                this.droneY = Math.random() * (GAME_HEIGHT / 2);
            }

            update() {
                this.x -= gameSpeed;
            }

            draw(ctx) {
                // Hazmat Suit
                ctx.fillStyle = '#ffd700'; // Bright Yellow
                // Body
                ctx.fillRect(this.x, this.y + 20, this.width, this.height - 20);
                // Head
                ctx.beginPath(); ctx.arc(this.x + this.width/2, this.y + 15, 15, 0, Math.PI*2); ctx.fill();
                // Visor
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(this.x + 5, this.y + 5, 20, 15);
                // Legs (simple animation based on x position)
                ctx.fillStyle = '#cca800';
                let step = Math.sin(this.x * 0.1) * 10;
                ctx.fillRect(this.x + 5, this.y + this.height - 10, 12, 10 + step);
                ctx.fillRect(this.x + 23, this.y + this.height - 10, 12, 10 - step);

                // Sky Drone/Net (Obstacle)
                if(this.hasDrone) {
                    ctx.fillStyle = '#444';
                    ctx.fillRect(this.x + 10, this.droneY, 20, 20);
                    ctx.strokeStyle = 'rgba(255, 0, 0, 0.5)'; // Laser/Net tether
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(this.x + 20, this.droneY + 20);
                    ctx.lineTo(this.x + 20, this.y);
                    ctx.stroke();
                }
            }

            getBounds() {
                let bounds = [
                    { x: this.x + 5, y: this.y + 5, w: this.width - 10, h: this.height - 5 }
                ];
                if (this.hasDrone) {
                    bounds.push({ x: this.x + 10, y: this.droneY, w: 20, h: 20 });
                    // Tether collision (thin)
                    bounds.push({ x: this.x + 18, y: this.droneY + 20, w: 4, h: this.y - this.droneY - 20 });
                }
                return bounds;
            }
        }

        class Candy {
            constructor() {
                this.radius = 8;
                this.x = GAME_WIDTH;
                // Generate candy in sin wave pattern or random height
                this.y = 100 + Math.random() * (GAME_HEIGHT - 200);
                
                // Reese's colors: Orange, Yellow, Brown
                const colors = ['#d05d15', '#e2c044', '#442013'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.active = true;
                this.bob = Math.random() * Math.PI * 2;
            }

            update() {
                this.x -= gameSpeed;
                this.bob += 0.1;
            }

            draw(ctx) {
                if(!this.active) return;
                let drawY = this.y + Math.sin(this.bob) * 10;
                
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, drawY, this.radius, 0, Math.PI*2);
                ctx.fill();
                
                // Candy shine
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.beginPath();
                ctx.arc(this.x - 2, drawY - 2, 2, 0, Math.PI*2);
                ctx.fill();
            }

            getBounds() {
                return {
                    x: this.x - this.radius,
                    y: this.y + Math.sin(this.bob) * 10 - this.radius,
                    w: this.radius * 2,
                    h: this.radius * 2
                };
            }
        }

        // --- GAME ENGINE ---

        let bg, bike, obstacles, candies;

        function initGame() {
            bg = new Background();
            bike = new Bike();
            obstacles = [];
            candies = [];
            score = 0;
            frameCount = 0;
            gameSpeed = 5 + (GAME_WIDTH > 800 ? 2 : 0); // slightly faster on desktop
            scoreDisplay.innerText = `SCORE: ${score}`;
        }

        function checkCollision(rect1, rect2) {
            return (
                rect1.x < rect2.x + rect2.w &&
                rect1.x + rect1.w > rect2.x &&
                rect1.y < rect2.y + rect2.h &&
                rect1.y + rect1.h > rect2.y
            );
        }

        function spawnEntities() {
            // Spawn Hazmats
            if (frameCount % 120 === 0 && Math.random() > 0.2) {
                obstacles.push(new Hazmat());
            }

            // Spawn Candies (clusters)
            if (frameCount % 60 === 0) {
                if(Math.random() > 0.3) {
                    candies.push(new Candy());
                    // Sometimes spawn a trail
                    if(Math.random() > 0.5) {
                        setTimeout(() => { if(isPlaying) candies.push(new Candy()); }, 200);
                        setTimeout(() => { if(isPlaying) candies.push(new Candy()); }, 400);
                    }
                }
            }
        }

        function gameOver() {
            isPlaying = false;
            finalScoreDisplay.innerText = score;
            gameOverScreen.classList.remove('hidden');
            scoreDisplay.classList.add('hidden');
            instructions.classList.add('hidden');
        }

        function gameLoop() {
            if (!isPlaying) return;

            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // Update & Draw Background
            bg.update();
            bg.draw(ctx);

            spawnEntities();

            // Update & Draw Bike
            bike.update();
            let bikeBounds = bike.getBounds();

            // Handle Candies
            for (let i = candies.length - 1; i >= 0; i--) {
                let candy = candies[i];
                candy.update();
                candy.draw(ctx);

                // Collision with candy
                if (candy.active && checkCollision(bikeBounds, candy.getBounds())) {
                    candy.active = false;
                    score += 10;
                    scoreDisplay.innerText = `SCORE: ${score}`;
                    // Optional: increase speed slightly over time
                    if(score % 100 === 0) gameSpeed += 0.5;
                }

                if (candy.x < -20) candies.splice(i, 1);
            }

            // Handle Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.update();
                obs.draw(ctx);

                // Collision checks
                let obsBoundsArray = obs.getBounds();
                for(let ob of obsBoundsArray) {
                    if (checkCollision(bikeBounds, ob)) {
                        gameOver();
                        return; // Stop loop immediately
                    }
                }

                // Score for passing obstacle safely
                if (!obs.passed && obs.x + obs.width < bike.x) {
                    score += 5;
                    scoreDisplay.innerText = `SCORE: ${score}`;
                    obs.passed = true;
                }

                // Cleanup
                if (obs.x + obs.width < -10) {
                    obstacles.splice(i, 1);
                }
            }

            bike.draw(ctx);

            frameCount++;
            requestAnimationFrame(gameLoop);
        }

        // --- INPUT HANDLING ---

        function handleInputStart(e) {
            // Prevent default to stop scrolling/zooming on mobile, unless it's on a UI button
            if(e.target.tagName !== 'BUTTON') {
                e.preventDefault(); 
            }
            if (isPlaying) {
                isThrusting = true;
            }
        }

        function handleInputEnd(e) {
            if(e.target.tagName !== 'BUTTON') {
                e.preventDefault();
            }
            isThrusting = false;
        }

        // Mouse / Touch
        window.addEventListener('mousedown', handleInputStart, {passive: false});
        window.addEventListener('mouseup', handleInputEnd, {passive: false});
        window.addEventListener('touchstart', handleInputStart, {passive: false});
        window.addEventListener('touchend', handleInputEnd, {passive: false});

        // Keyboard
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                if(isPlaying) isThrusting = true;
            }
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                isThrusting = false;
            }
        });

        // --- UI BINDINGS ---

        function startGame() {
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            scoreDisplay.classList.remove('hidden');
            instructions.classList.remove('hidden');
            initGame();
            isPlaying = true;
            // Draw one frame immediately to prevent blank flash
            bg.draw(ctx); 
            bike.draw(ctx);
            requestAnimationFrame(gameLoop);
        }

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        // Initial draw for background aesthetic before starting
        bg = new Background();
        bg.draw(ctx);

    </script>
</body>
</html>
